name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  values:
    name: values against openpyxl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: pip install --quiet openpyxl
      # A different implementation reads the same files; every cell has to agree.
      - run: python3 scripts/verify_against_openpyxl.py --quick
      - run: |
          set -euo pipefail
          out=$(./target/release/xlsmith csv tests/fixtures/simple.ods --sheet Sales)
          test -n "$out"
          ./target/release/xlsmith sheets tests/fixtures/simple.xls
