name: fuzz

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      # Install on stable and invoke with +nightly: a marketplace action left the
      # subcommand unavailable here before.
      - run: cargo install cargo-fuzz --locked
      - run: mkdir -p fuzz/corpus/parse && cp fuzz/seeds/* fuzz/corpus/parse/
      # cargo-fuzz builds with panic=abort, so a parser panic arrives as a crash
      # even though the shipping binary catches it and reports the file. That is
      # still the most useful signal here: every artifact is a calamine bug, and
      # the guard in src/lib.rs is what keeps users away from it.
      - run: cargo +nightly fuzz run parse -- -max_total_time=900
        continue-on-error: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash
          path: fuzz/artifacts/parse/
