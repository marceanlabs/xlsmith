[package]
name = "xlsmith"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read a spreadsheet and get the data out as CSV or JSON, without opening Excel"
license = "Apache-2.0"
repository = "https://github.com/marceanlabs/xlsmith"
homepage = "https://github.com/marceanlabs/xlsmith"
readme = "README.md"
keywords = ["xlsx", "csv", "spreadsheet", "excel", "cli"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
calamine = { version = "0.37.0", features = ["dates"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
wildcard_imports = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
missing_panics_doc = "warn"
clone_on_ref_ptr = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
